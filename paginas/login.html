<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Level-Up Gamer</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                <a href="../index.html">
                    LEVEL-UP GAMER
                </a>
            </div>

            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>

            <div class="nav-actions">
                <a href="carrito.html">🛒</a>
            </div>

        </nav>
    </header>


    <main>

        <section class="form-container">

            <h1>Iniciar sesión</h1>

            <p>Ingresa a tu cuenta de Level-Up Gamer</p>

            <form id="form-login" novalidate>

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        maxlength="100"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="clave">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="clave"
                        name="clave"
                        minlength="4"
                        maxlength="10"
                        placeholder="Entre 4 y 10 caracteres"
                        required
                    >

                </div>


                <p id="mensaje-login" class="form-message"></p>


                <button
                    type="submit"
                    class="btn"
                >
                    Iniciar sesión
                </button>

            </form>


            <p>
                ¿No tienes una cuenta?
                <a href="registro.html">
                    Registrarse
                </a>
            </p>

        </section>

    </main>


    <footer>
        <p>
            © 2026 Level-Up Gamer
        </p>
    </footer>


    <script src="../js/login.js"></script>

</body>
</html>
